<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>color-accent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body><div class="eyebrow">Accent · JetBrains violet (the only interaction color)</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--fl-accent)"></div><div class="lab"><div class="name">Accent</div><div class="hex">#A855F7</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-accent-bright)"></div><div class="lab"><div class="name">Bright (active text)</div><div class="hex">#C084FC</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-accent-press)"></div><div class="lab"><div class="name">Press</div><div class="hex">#8B3FD6</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-surface);display:grid;place-items:center"><span style="background:var(--fl-accent-tint);color:var(--fl-accent-bright);padding:6px 12px;border-radius:8px;font-weight:700;font-size:12px">Tint 16%</span></div><div class="lab"><div class="name">Accent tint</div><div class="hex">rgba(168,85,247,.16)</div></div></div>
</div>
<div style="margin-top:14px;display:flex;gap:10px;align-items:center">
<span class="pill" style="background:var(--fl-accent);color:#fff">Primary action</span>
<a style="color:var(--fl-accent-bright);font-weight:600;font-size:14px;text-decoration:none">Link / active</a>
<span style="font-size:13px;color:var(--fl-ink-3)">Used only for interaction — never decoration.</span>
</div><script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script></body></html>
