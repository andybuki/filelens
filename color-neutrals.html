<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>color-neutrals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body><div class="eyebrow">Neutrals · dark canvas + surfaces</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--fl-bg)"></div><div class="lab"><div class="name">Canvas</div><div class="hex">#16171A</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-surface)"></div><div class="lab"><div class="name">Surface</div><div class="hex">#1E2024</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-surface-2)"></div><div class="lab"><div class="name">Surface-2</div><div class="hex">#25272D</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-surface-3)"></div><div class="lab"><div class="name">Surface-3</div><div class="hex">#2E3138</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-border)"></div><div class="lab"><div class="name">Border</div><div class="hex">#34373E</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-border-2)"></div><div class="lab"><div class="name">Border-2</div><div class="hex">#3F434B</div></div></div>
</div>
<div class="row" style="margin-top:14px;gap:24px">
<div><div style="font-size:17px;font-weight:700;color:var(--fl-ink)">Ink — primary</div><div class="hex tert">#E4E6EB</div></div>
<div><div style="font-size:17px;font-weight:500;color:var(--fl-ink-2)">Ink-2 — secondary</div><div class="hex tert">#A4A8B2</div></div>
<div><div style="font-size:17px;font-weight:500;color:var(--fl-ink-3)">Ink-3 — tertiary</div><div class="hex tert">#6E727C</div></div>
</div><script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script></body></html>
