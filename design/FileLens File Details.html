<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FileLens — File Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="min/tokens.css" />
<link rel="stylesheet" href="details/details.css" />
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#0F2A44"/><rect x="30" y="22" width="40" height="52" rx="5" fill="#E8EEF6"/><circle cx="50" cy="56" r="6" fill="#2563EB"/></svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="details/icons.jsx"></script>
<script type="text/babel" src="details/app.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  function Mount() {
    const [scale, setScale] = useState(1);
    useEffect(() => {
      const fit = () => setScale(Math.min((window.innerWidth - 28) / 412, (window.innerHeight - 28) / 842, 1.05));
      fit(); window.addEventListener("resize", fit); return () => window.removeEventListener("resize", fit);
    }, []);
    return (
      <div style={{ transform: "scale(" + scale + ")" }}>
        <div className="phone">
          <div className="island" />
          <window.Details />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Mount />);
</script>
</body>
</html>
