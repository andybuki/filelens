<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>color-categories</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body><div class="eyebrow">Category seeds · per file type (icon tile + ext badge)</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px">
<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-dir);width:14px;height:14px;border-radius:4px"></span>Folder</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-image);width:14px;height:14px;border-radius:4px"></span>Image</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-video);width:14px;height:14px;border-radius:4px"></span>Video</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-audio);width:14px;height:14px;border-radius:4px"></span>Audio</div>
<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-doc);width:14px;height:14px;border-radius:4px"></span>Document</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-sheet);width:14px;height:14px;border-radius:4px"></span>Spreadsheet</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-pres);width:14px;height:14px;border-radius:4px"></span>Presentation</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-archive);width:14px;height:14px;border-radius:4px"></span>Archive</div>
<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-code);width:14px;height:14px;border-radius:4px"></span>Code</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-text);width:14px;height:14px;border-radius:4px"></span>Text</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-pdf);width:14px;height:14px;border-radius:4px"></span>PDF</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-apk);width:14px;height:14px;border-radius:4px"></span>APK</div>
<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-db);width:14px;height:14px;border-radius:4px"></span>Database</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-font);width:14px;height:14px;border-radius:4px"></span>Font</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-exe);width:14px;height:14px;border-radius:4px"></span>Executable</div><div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:var(--cat-unknown);width:14px;height:14px;border-radius:4px"></span>Unknown</div>
</div><script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script></body></html>
