<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>comp-file-rows</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body><div class="eyebrow">File rows · icon tile · mono meta · ext badge · severity dot · selection</div>
<div class="col" style="gap:6px">

<div style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;position:relative;background:var(--fl-surface)">
  <span style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat-dir) 14%,transparent);flex:0 0 auto"><i data-lucide="folder" style="color:var(--cat-dir);width:19px;height:19px"></i></span>
  <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:500;">Documents</div><div class="mono" style="font-size:11.5px;color:var(--fl-ink-3);margin-top:2px">24 items</div></div>
  
  
</div>

<div style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;position:relative;background:var(--fl-accent-tint-2);box-shadow:inset 2px 0 0 var(--fl-accent)">
  <span style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat-doc) 14%,transparent);flex:0 0 auto"><i data-lucide="file-text" style="color:var(--cat-doc);width:19px;height:19px"></i></span>
  <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:500;color:var(--fl-accent-bright)">report.docx</div><div class="mono" style="font-size:11.5px;color:var(--fl-ink-3);margin-top:2px">1.8 MB · Mar 4</div></div>
  <span class="mono" style="font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:5px;color:var(--cat-doc);background:color-mix(in srgb,var(--cat-doc) 16%,transparent)">DOCX</span>
  <span class="dot" style="background:var(--fl-warning)"></span>
</div>

<div style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;position:relative;background:var(--fl-surface)">
  <span style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat-image) 14%,transparent);flex:0 0 auto"><i data-lucide="image" style="color:var(--cat-image);width:19px;height:19px"></i></span>
  <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:500;">photo.jpg</div><div class="mono" style="font-size:11.5px;color:var(--fl-ink-3);margin-top:2px">3.2 MB · Feb 28</div></div>
  <span class="mono" style="font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:5px;color:var(--cat-image);background:color-mix(in srgb,var(--cat-image) 16%,transparent)">JPG</span>
  <span class="dot" style="background:var(--fl-danger)"></span>
</div>

<div style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;position:relative;background:var(--fl-surface)">
  <span style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat-archive) 14%,transparent);flex:0 0 auto"><i data-lucide="file-archive" style="color:var(--cat-archive);width:19px;height:19px"></i></span>
  <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:500;">archive.zip</div><div class="mono" style="font-size:11.5px;color:var(--fl-ink-3);margin-top:2px">12.4 MB · Mar 2</div></div>
  <span class="mono" style="font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:5px;color:var(--cat-archive);background:color-mix(in srgb,var(--cat-archive) 16%,transparent)">ZIP</span>
  <span class="dot" style="background:var(--fl-info)"></span>
</div>

<div style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;position:relative;background:var(--fl-surface)">
  <span style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat-code) 14%,transparent);flex:0 0 auto"><i data-lucide="braces" style="color:var(--cat-code);width:19px;height:19px"></i></span>
  <div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:500;">config.json</div><div class="mono" style="font-size:11.5px;color:var(--fl-ink-3);margin-top:2px">4 KB · Feb 26</div></div>
  <span class="mono" style="font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:5px;color:var(--cat-code);background:color-mix(in srgb,var(--cat-code) 16%,transparent)">JSON</span>
  <span class="dot" style="background:var(--fl-danger)"></span>
</div>
</div><script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script></body></html>
