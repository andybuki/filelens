<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FileLens — Android UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../colors_and_type.css" />
<link rel="stylesheet" href="kit.css" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #0f1012; }
  #root { position: fixed; inset: 0; display: grid; place-items: center; }
  #scaler { transform-origin: center center; }
</style>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#16171A"/><circle cx="44" cy="44" r="20" fill="none" stroke="#A855F7" stroke-width="6"/><circle cx="44" cy="44" r="7" fill="#A855F7"/><rect x="56" y="56" width="22" height="9" rx="4.5" transform="rotate(45 56 56)" fill="#A855F7"/></svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;
  const DEV_W = 412 + 16, DEV_H = 892 + 16; // include 8px bezel border
  function Stage() {
    const ref = useRef(null);
    const [scale, setScale] = useState(1);
    useEffect(() => {
      const fit = () => {
        const pad = 32;
        const s = Math.min((window.innerWidth - pad) / DEV_W, (window.innerHeight - pad) / DEV_H, 1.1);
        setScale(s);
      };
      fit();
      window.addEventListener("resize", fit);
      return () => window.removeEventListener("resize", fit);
    }, []);
    return (
      <div id="scaler" ref={ref} style={{ transform: "scale(" + scale + ")" }}>
        <AndroidDevice dark>
          <window.FileLensApp />
        </AndroidDevice>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Stage />);
</script>
</body>
</html>
