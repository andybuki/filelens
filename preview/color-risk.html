<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>color-risk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body><div class="eyebrow">Risk semantics · color = meaning</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--fl-danger-tint);display:grid;place-items:center"><i data-lucide="shield-alert" style="color:var(--fl-danger);width:22px;height:22px"></i></div><div class="lab"><div class="name" style="color:var(--fl-danger)">Danger</div><div class="hex">--fl-danger</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-warning-tint);display:grid;place-items:center"><i data-lucide="triangle-alert" style="color:var(--fl-warning);width:22px;height:22px"></i></div><div class="lab"><div class="name" style="color:var(--fl-warning)">Warning</div><div class="hex">--fl-warning</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-info-tint);display:grid;place-items:center"><i data-lucide="info" style="color:var(--fl-info);width:22px;height:22px"></i></div><div class="lab"><div class="name" style="color:var(--fl-info)">Info</div><div class="hex">--fl-info</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fl-safe-tint);display:grid;place-items:center"><i data-lucide="shield-check" style="color:var(--fl-safe);width:22px;height:22px"></i></div><div class="lab"><div class="name" style="color:var(--fl-safe)">Safe</div><div class="hex">--fl-safe</div></div></div>
</div>
<div style="margin-top:12px;font-size:13px;color:var(--fl-ink-2)">Each has a ~14% tint for fills. Reserved for risk findings and trust — never used to decorate neutral UI.</div><script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script></body></html>
