<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>comp-buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body><div class="eyebrow">Buttons &amp; FAB</div>
<div class="row" style="align-items:center;gap:14px;margin-bottom:16px">
<span style="display:inline-flex;align-items:center;gap:7px;background:var(--fl-accent);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:11px"><i data-lucide="shield-check" style="width:16px;height:16px"></i>Open safely</span>
<span style="display:inline-flex;align-items:center;gap:7px;background:var(--fl-accent-press);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:11px;transform:scale(.98)"><i data-lucide="shield-check" style="width:16px;height:16px"></i>Pressed</span>
<span style="display:inline-flex;align-items:center;gap:7px;background:var(--fl-surface-3);color:var(--fl-ink);font-size:13px;font-weight:600;padding:10px 16px;border-radius:11px"><i data-lucide="share-2" style="width:16px;height:16px"></i>Safe share</span>
<span style="display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--fl-disabled);font-size:13px;font-weight:600;padding:10px 16px;border-radius:11px;border:1px solid var(--fl-border)">Disabled</span>
</div>
<div class="row" style="align-items:center;gap:14px">
<span style="width:40px;height:40px;border-radius:11px;background:var(--fl-surface-3);display:grid;place-items:center"><i data-lucide="sliders-horizontal" style="color:var(--fl-ink-2)"></i></span>
<span style="width:40px;height:40px;border-radius:11px;background:var(--fl-surface-3);display:grid;place-items:center"><i data-lucide="search" style="color:var(--fl-ink-2)"></i></span>
<span style="width:52px;height:52px;border-radius:16px;background:var(--fl-accent);display:grid;place-items:center;box-shadow:var(--sh-accent)"><i data-lucide="upload" style="color:#fff;width:22px;height:22px"></i></span>
<span class="tert" style="font-size:12px">FAB · Import / scan</span>
</div><script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script></body></html>
