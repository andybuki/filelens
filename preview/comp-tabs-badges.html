<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>comp-tabs-badges</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body><div class="eyebrow">Inspector tabs · ext badges · chips</div>
<div style="display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap">
<span style="font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;color:var(--fl-accent-bright);background:var(--fl-accent-tint)">Overview</span><span style="font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;color:var(--fl-ink-3)">Preview</span><span style="font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;color:var(--fl-ink-3)">Structure</span><span style="font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;color:var(--fl-ink-3)">Metadata</span><span style="font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;color:var(--fl-ink-3)">Risks</span>
</div>
<div class="row" style="gap:8px;align-items:center">
<span class="mono" style="font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:6px;color:var(--cat-doc);background:color-mix(in srgb,var(--cat-doc) 16%,transparent)">DOCX</span><span class="mono" style="font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:6px;color:var(--cat-archive);background:color-mix(in srgb,var(--cat-archive) 16%,transparent)">ZIP</span><span class="mono" style="font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:6px;color:var(--cat-image);background:color-mix(in srgb,var(--cat-image) 16%,transparent)">JPG</span><span class="mono" style="font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:6px;color:var(--cat-code);background:color-mix(in srgb,var(--cat-code) 16%,transparent)">JSON</span><span class="mono" style="font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:6px;color:var(--cat-pdf);background:color-mix(in srgb,var(--cat-pdf) 16%,transparent)">PDF</span><span class="mono" style="font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:6px;color:var(--cat-apk);background:color-mix(in srgb,var(--cat-apk) 16%,transparent)">APK</span>
</div>
<div class="row" style="gap:8px;margin-top:14px">
<span class="pill" style="background:var(--fl-surface-3);color:var(--fl-ink-2);font-weight:600"><i data-lucide="map-pin" style="width:13px;height:13px"></i>From Downloads</span>
<span class="pill" style="background:var(--fl-surface-3);color:var(--fl-ink-2);font-weight:600"><i data-lucide="key-round" style="width:13px;height:13px"></i>1 secret found</span>
</div><script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script></body></html>
