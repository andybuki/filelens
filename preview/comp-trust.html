<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>comp-trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body><div class="eyebrow">Trust score · chip · ring · meter</div>
<div class="row" style="gap:10px;margin-bottom:18px">
<span class="pill" style="background:color-mix(in srgb,var(--fl-trust-trusted) 16%,transparent);color:var(--fl-trust-trusted)"><i data-lucide="shield-check" style="width:14px;height:14px;color:var(--fl-trust-trusted)"></i>Trusted · 96</span>
<span class="pill" style="background:color-mix(in srgb,var(--fl-trust-low) 16%,transparent);color:var(--fl-trust-low)"><i data-lucide="shield-check" style="width:14px;height:14px;color:var(--fl-trust-low)"></i>Low risk · 74</span>
<span class="pill" style="background:color-mix(in srgb,var(--fl-trust-medium) 16%,transparent);color:var(--fl-trust-medium)"><i data-lucide="triangle-alert" style="width:14px;height:14px;color:var(--fl-trust-medium)"></i>Medium risk · 58</span>
<span class="pill" style="background:color-mix(in srgb,var(--fl-trust-high) 16%,transparent);color:var(--fl-trust-high)"><i data-lucide="shield-alert" style="width:14px;height:14px;color:var(--fl-trust-high)"></i>High risk · 31</span>
</div>
<div class="row" style="align-items:center;gap:26px">
<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--fl-surface-3)" stroke-width="6"/><circle cx="32" cy="32" r="27" fill="none" stroke="var(--fl-trust-low)" stroke-width="6" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="44.1" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-family="Roboto Mono" font-size="17" font-weight="700" fill="var(--fl-ink)">74</text></svg>
<div style="flex:1;min-width:180px">
<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span class="muted">Trust score</span><span class="mono" style="color:var(--fl-trust-low);font-weight:700">74 / 100</span></div>
<div style="height:8px;border-radius:999px;background:var(--fl-surface-3);overflow:hidden"><div style="width:74%;height:100%;background:var(--fl-trust-low)"></div></div>
<div class="tert" style="font-size:11.5px;margin-top:8px">Heuristic only — not antivirus, not malware detection.</div>
</div>
</div><script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script></body></html>
